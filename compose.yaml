services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leaguewatch
      POSTGRES_PASSWORD: leaguewatch
      POSTGRES_USER: leaguewatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaguewatch -d leaguewatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - leaguewatch_postgres_data:/var/lib/postgresql/data

volumes:
  leaguewatch_postgres_data:
